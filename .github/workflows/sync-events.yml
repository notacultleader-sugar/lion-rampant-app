name: Sync events from website

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull events from lionrampantpub.com
        run: python scripts/sync_events.py
      - name: Commit if events changed
        run: |
          if git diff --quiet -- events.json; then
            echo "Events unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Sync events from lionrampantpub.com"
          git push
